# فعال‌سازی GitHub Pages (استاتیک، از همین شاخه) با توکن workflow
name: Enable Pages

on:
  push:
    branches:
      - 'arena/95e0c1a0-persian-embedding-space-explor'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  enable-pages:
    runs-on: ubuntu-latest
    steps:
      - name: Ensure GitHub Pages is enabled for this branch
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: arena/95e0c1a0-persian-embedding-space-explor
        run: |
          set -uo pipefail
          report() { # context code body
            gh api -X POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
              -f state=failure -f context="$1" \
              -f description="$(printf '%s' "$3" | head -c 130)" >/dev/null 2>&1 || true
          }
          if gh api "repos/${GITHUB_REPOSITORY}/pages" >/dev/null 2>&1; then
            echo "Pages already enabled."
            gh api "repos/${GITHUB_REPOSITORY}/pages" --jq '{html_url,status,source}'
            exit 0
          fi
          # variant 1: source only
          c1=$(curl -sS -o /tmp/r1 -w '%{http_code}' -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages" \
            -d "{\"source\":{\"branch\":\"${BRANCH}\",\"path\":\"/\"}}") || c1=curlfail
          report pages-diag-1 "$c1" "$(cat /tmp/r1 2>/dev/null)"
          echo "variant1: $c1 $(cat /tmp/r1 2>/dev/null)"
          if [ "$c1" = "201" ] || [ "$c1" = "200" ]; then
            gh api "repos/${GITHUB_REPOSITORY}/pages" --jq '{html_url,status,source}'
            exit 0
          fi
          # variant 2: with build_type=legacy
          c2=$(curl -sS -o /tmp/r2 -w '%{http_code}' -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages" \
            -d "{\"source\":{\"branch\":\"${BRANCH}\",\"path\":\"/\"},\"build_type\":\"legacy\"}") || c2=curlfail
          report pages-diag-2 "$c2" "$(cat /tmp/r2 2>/dev/null)"
          echo "variant2: $c2 $(cat /tmp/r2 2>/dev/null)"
          if [ "$c2" = "201" ] || [ "$c2" = "200" ]; then
            gh api "repos/${GITHUB_REPOSITORY}/pages" --jq '{html_url,status,source}'
            exit 0
          fi
          exit 1
