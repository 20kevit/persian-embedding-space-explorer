# فعال‌سازی GitHub Pages (استاتیک، از همین شاخه) با توکن workflow
# یک‌بار اجرا می‌شود؛ اگر Pages از قبل فعال باشد، کار را تأیید و خروج می‌دهد.
name: Enable Pages

on:
  push:
    branches:
      - 'arena/95e0c1a0-persian-embedding-space-explor'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  enable-pages:
    runs-on: ubuntu-latest
    steps:
      - name: Ensure GitHub Pages is enabled for this branch
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: arena/95e0c1a0-persian-embedding-space-explor
        run: |
          set -euo pipefail
          if gh api "repos/${GITHUB_REPOSITORY}/pages" >/dev/null 2>&1; then
            echo "Pages already enabled."
            gh api "repos/${GITHUB_REPOSITORY}/pages" --jq '{html_url,status,source}'
          else
            echo "Enabling Pages from branch: ${BRANCH}"
            gh api -X POST "repos/${GITHUB_REPOSITORY}/pages" \
              -f "source[branch]=${BRANCH}" \
              -f "source[path]=/" \
              -f "build_type=legacy" \
              --jq '{html_url,status,source}'
          fi
